[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Mezo's EVM targets the London hard fork (no PUSH0 / Cancun opcodes).
evm_version = "london"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
mezo_mainnet = "https://mezo.drpc.org"

[fmt]
line_length = 120
